version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: threatshield-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./threatshield.db
      - DEMO_MODE=true
      - ENVIRONMENT=development
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./threatshield.db:/app/threatshield.db
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatshield-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  models:
  data:
